name: Template
on:
  push:
    branches:
      - 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: linux-docker
    container:
      image: docker.io/node:current-alpine
    name: ${{ matrix.name }}
    outputs:
      status: ${{ steps.early.outputs.status }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimal Template (target=editor, everything disabled)
            cache-name: linux-template-minimal
            target: editor
            tests: false
            artifact: true
    steps:
      - name: Check-out repository
        uses: https://code.forgejo.org/actions/checkout@v4.3.0

      - name: Run script
        id: early
        env:
          CUSTOMTOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm *.import
          rm project.godot
          rm -rf addons docker gdUnit4 zig-template

          wget https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          unzip Godot_v4.7.2-stable_win64.exe.zip

          apk add wine python3 py3-pip git ruff

          export WINEDEBUG=-all

          wine Godot_v4.7.2-stable_win64.exe -s bin/gds.gd --headless --no-header bin/gds.gd --format bin/gds.gd
          wine Godot_v4.7.2-stable_win64.exe -s bin/gds.gd --headless --no-header bin/gds.gd --setup

          rm Godot_v4.7.2-stable_win64.exe Godot_v4.7.2-stable_win64_console.exe Godot_v4.7.2-stable_win64.exe.zip

          python3 bin/gds.py --format bin/gds.gd
          python3 bin/gds.py --setup
          touch requirements.txt
          python3 -m pip install .  --no-cache-dir --no-deps --break-system-packages
          rm -rf gdsbin.egg-info _build
          rm pyproject.toml
          find . -name "*.py" -type f | xargs rm --
          python3 -m gdsbin --format bin/gds.gd
          python3 -m gdsbin --setup
          find . -name "*.gd" -type f | xargs rm --
          git clone https://oauth:${{ secrets.GITHUB_TOKEN }}@codeberg.org/LinuxUserGD/gdscript-transpiler-bin.git -b python
          echo "Uploading files..."
          dir=$(find */ -maxdepth 0 -type d ! -name "gdscript-transpiler-bin")
          cd gdscript-transpiler-bin
          rm -rf $(ls | grep -v "requirements.txt")
          for i in $dir; do mkdir ${i} ; done
          for i in $dir; do cp -r "../${i}"*.py ${i} ; done
          mkdir -p gdsbin/test; cp -r ../gdsbin/test/*.py gdsbin/test/
          for i in $(echo "setup.py pyproject.toml README.md CONTRIBUTING.md CREDITS.md LICENSE.md icon.svg python.svg mit.svg Godot-v.svg"); do cp ../${i} . ; done
          git config --global user.name "LinuxUserGD"
          git config --global user.email "hugegameartgd@gmail.com"
          git add -A
          [ -n "$(git diff-index HEAD)" ] && { echo "New update"; git commit -m "update python files" && git push origin python; } || { echo "Files identical"; exit 0; }
          cd -
          echo ${PWD}


  deploy-linux:
    runs-on: linux-docker
    container:
      image: docker.io/node:current-alpine
    name: Deploy (Alpine Linux x86_64)
    needs: build-linux

    steps:
      - name: Check-out repository
        uses: https://codeberg.org/ziglang/checkout@main
        with:
          ref: python

      - name: Compile gdscript-transpiler-bin
        env:
          CUSTOMTOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk add python3 python3-dev py3-pip go zig git
          apk add patchelf=0.17.0-r0 --repository=http://dl-cdn.alpinelinux.org/alpine/v3.17/community

          python3 -m pip install Nuitka[onefile] zstandard --no-cache-dir --break-system-packages
          python3 -m nuitka bin/gds.py --onefile --lto=yes --static-libpython=no --zig --assume-yes-for-downloads --remove-output -o gds
          export BUTLER_API_KEY=${{ secrets.BUTLER_CREDENTIALS }}
          echo $BUTLER_API_KEY > key.txt
          git clone https://github.com/LinuxUserGD/butler.git
          cd butler
          go build
          cd -
          ./butler/butler -i key.txt push gds linuxusergd/gdscript-transpiler-bin:linux

      - name: Upload main.dist
        uses: actions/upload-artifact@v3
        with:
          name: Linux Build
          path: /home/runner/work/gdscript-transpiler-bin/gdscript-transpiler-bin/gds
